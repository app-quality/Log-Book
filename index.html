<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ganti judul sesuai nama aplikasi Anda -->
    <title>IH-App</title>
    
    <!-- Opsional: Deskripsi saat link dibagikan di WhatsApp/Media Sosial -->
    <meta name="description" content=Log Book Induction Hardening>
    
    <style>
        /* Menghilangkan margin bawaan dan scroll ganda */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Membuat iframe tampil 100% layar penuh */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <!-- Ganti atribut src dengan URL Web App Google Apps Script (/exec) Anda -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzWEqnn1JHMFSV79la1o238p6Ly2CeQpytN8-Z_6bHw5YItXKo4XFeRvOazX-tSFxsi4A/exec" 
        allow="geolocation; microphone; camera; midi; encrypted-media;"
        allowfullscreen>
    </iframe>

</body>
</html>
